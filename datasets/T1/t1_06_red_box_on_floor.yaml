id: t1_06_red_box_on_floor
tier: T1
dataset: main
prompt: "A red box on the floor."

# T1 — basic stacking. Tests the synthetic `on` relation expanded from
# on_top_of and the model's height-math for a primitive sitting on a
# floor.

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_box
      type: Box
      on_top_of: floor

  attributes:
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]

  relations: []
