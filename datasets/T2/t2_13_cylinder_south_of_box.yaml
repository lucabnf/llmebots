id: t2_13_cylinder_south_of_box
tier: T2
dataset: main
prompt: "A green cylinder south of a red box. Both are on the floor."

# T2 — simple cardinal (south_of).

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_box
      type: Box
      on_top_of: floor
    - id: green_cylinder
      type: Cylinder
      on_top_of: floor

  attributes:
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]
    - target: green_cylinder
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]

  relations:
    - type: south_of
      subject: green_cylinder
      reference: red_box
