id: t2_17_cylinder_southwest_of_box
tier: T2
dataset: main
prompt: "A yellow cylinder southwest of a red box. Both are on the floor."

# T2 — compound cardinal (southwest_of). Last of the four compound
# cardinals.

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_box
      type: Box
      on_top_of: floor
    - id: yellow_cylinder
      type: Cylinder
      on_top_of: floor

  attributes:
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]
    - target: yellow_cylinder
      field: baseColor
      constraint: equals
      value: [1.0, 1.0, 0.0]

  relations:
    - type: southwest_of
      subject: yellow_cylinder
      reference: red_box
