id: t2_22_box_near_sphere_floor
tier: T2
dataset: main
prompt: "A red box near a blue sphere. Both are on the floor."

# T2 — "near", floor-grounded (T1's near/above pairs float; this tests
# the same relation type with explicit floor support).

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_box
      type: Box
      on_top_of: floor
    - id: blue_sphere
      type: Sphere
      on_top_of: floor

  attributes:
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]
    - target: blue_sphere
      field: baseColor
      constraint: equals
      value: [0.0, 0.0, 1.0]

  relations:
    - type: near
      subject: red_box
      reference: blue_sphere
