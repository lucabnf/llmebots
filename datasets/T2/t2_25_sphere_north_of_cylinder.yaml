id: t2_25_sphere_north_of_cylinder
tier: T2
dataset: main
prompt: "A red sphere north of a green cylinder. Both are on the floor."

# T2 — north_of, new object/color combo (mirrors t2_12's pattern).

spec:
  objects:
    - id: floor
      type: Floor
    - id: green_cylinder
      type: Cylinder
      on_top_of: floor
    - id: red_sphere
      type: Sphere
      on_top_of: floor

  attributes:
    - target: green_cylinder
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]
    - target: red_sphere
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]

  relations:
    - type: north_of
      subject: red_sphere
      reference: green_cylinder
