id: t3_24_cone_ne_sphere_box_south
tier: T3
dataset: main
prompt: "A red sphere on the floor. A green cone is northeast of the sphere. A blue box is south of the sphere."

# T3 — compound + simple cardinal from a shared reference.

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_sphere
      type: Sphere
      on_top_of: floor
    - id: green_cone
      type: Cone
      on_top_of: floor
    - id: blue_box
      type: Box
      on_top_of: floor

  attributes:
    - target: red_sphere
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]
    - target: green_cone
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]
    - target: blue_box
      field: baseColor
      constraint: equals
      value: [0.0, 0.0, 1.0]

  relations:
    - type: northeast_of
      subject: green_cone
      reference: red_sphere
    - type: south_of
      subject: blue_box
      reference: red_sphere
