id: t3_26_distance_one_meter_plus_east
tier: T3
dataset: main
prompt: "A red box on the floor. A blue sphere is exactly one meter from the box. A green cylinder is east of the sphere."

# T3 — metric distance + cardinal chained through the sphere.

spec:
  objects:
    - id: floor
      type: Floor
    - id: red_box
      type: Box
      on_top_of: floor
    - id: blue_sphere
      type: Sphere
      on_top_of: floor
    - id: green_cylinder
      type: Cylinder
      on_top_of: floor

  attributes:
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]
    - target: blue_sphere
      field: baseColor
      constraint: equals
      value: [0.0, 0.0, 1.0]
    - target: green_cylinder
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]

  relations:
    - type: distance
      subject: blue_sphere
      reference: red_box
      value: 1.0
    - type: east_of
      subject: green_cylinder
      reference: blue_sphere
