id: t3_28_cylinder_east_of_plane_box_on_floor
tier: T3
dataset: main
prompt: "A grey plane standing as a panel. A green cylinder is east of the plane. A red box is on the floor."

# T3 — Plane in a real T3 scene. Plane is the cardinal reference (its
# X half-extent governs the east_of gap threshold). The Y axis caveat
# does not matter because east_of is purely along X.

spec:
  objects:
    - id: floor
      type: Floor
    - id: grey_plane
      type: Plane
    - id: green_cylinder
      type: Cylinder
      on_top_of: floor
    - id: red_box
      type: Box
      on_top_of: floor

  attributes:
    - target: grey_plane
      field: baseColor
      constraint: equals
      value: [0.5, 0.5, 0.5]
    - target: green_cylinder
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]

  relations:
    - type: east_of
      subject: green_cylinder
      reference: grey_plane
