id: t3_31_box_centered_sphere_west
tier: T3
dataset: main
prompt: "A blue box centered on the floor. A red sphere is west of the box."

# T3 — center_inside + cardinal, mirrors t3_21's pattern with
# different color/direction.

spec:
  objects:
    - id: floor
      type: Floor
    - id: blue_box
      type: Box
      on_top_of: floor
    - id: red_sphere
      type: Sphere
      on_top_of: floor

  attributes:
    - target: blue_box
      field: baseColor
      constraint: equals
      value: [0.0, 0.0, 1.0]
    - target: red_sphere
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]

  relations:
    - type: center_inside
      subject: blue_box
      reference: floor
    - type: west_of
      subject: red_sphere
      reference: blue_box
