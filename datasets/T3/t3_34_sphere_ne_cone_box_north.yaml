id: t3_34_sphere_ne_cone_box_north
tier: T3
dataset: main
prompt: "A green sphere on the floor. A blue cone is northeast of the sphere. A red box is north of the sphere."

# T3 — compound cardinal + plain cardinal off the same anchor,
# mirrors t3_24's pattern with different colors/direction combo.

spec:
  objects:
    - id: floor
      type: Floor
    - id: green_sphere
      type: Sphere
      on_top_of: floor
    - id: blue_cone
      type: Cone
      on_top_of: floor
    - id: red_box
      type: Box
      on_top_of: floor

  attributes:
    - target: green_sphere
      field: baseColor
      constraint: equals
      value: [0.0, 1.0, 0.0]
    - target: blue_cone
      field: baseColor
      constraint: equals
      value: [0.0, 0.0, 1.0]
    - target: red_box
      field: baseColor
      constraint: equals
      value: [1.0, 0.0, 0.0]

  relations:
    - type: northeast_of
      subject: blue_cone
      reference: green_sphere
    - type: north_of
      subject: red_box
      reference: green_sphere
