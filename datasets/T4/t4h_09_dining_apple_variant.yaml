id: t4h_09_dining_apple_variant
tier: T4
dataset: heldout
prompt: 'Set up a small dining corner for two: a table stands on the floor with a white chair east of it and a grey chair
  west of it. An apple lies on top of the table, and a fridge stands south of the table for convenience. Both chairs face
  the table.'
spec:
  objects:
  - id: floor
    type: Floor
  - id: table
    type: Table
    on_top_of: floor
  - id: chair_white
    type: Chair
    on_top_of: floor
  - id: chair_grey
    type: Chair
    on_top_of: floor
  - id: apple
    type: Apple
    on_top_of: table
  - id: fridge
    type: Fridge
    on_top_of: floor
  attributes:
  - target: chair_white
    field: color
    constraint: equals
    value:
    - 1.0
    - 1.0
    - 1.0
  - target: chair_grey
    field: color
    constraint: equals
    value:
    - 0.5
    - 0.5
    - 0.5
  relations:
  - type: east_of
    subject: chair_white
    reference: table
  - type: west_of
    subject: chair_grey
    reference: table
  - type: north_of
    subject: table
    reference: fridge
  - type: facing
    subject: chair_white
    reference: table
  - type: facing
    subject: chair_grey
    reference: table
