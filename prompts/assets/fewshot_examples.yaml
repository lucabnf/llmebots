# Few-shot demonstration examples for the s3 strategy.
#
# Each example pairs a natural-language scene description with a complete,
# correct .wbt file. The three examples are hand-crafted to demonstrate
# the failure modes observed in dev / main runs of s0 (zero-shot), s1
# (rules), and s2 (RAG):
#
#   1. Solid is the canonical visible-object wrapper (NOT Transform)
#   2. Floor is a primitive (NOT a thin Box used as substitute)
#   3. Floor stacking math: translation z = half-height, so the bottom
#      of a primitive sits at z = 0
#   4. Cone uses field name `bottomRadius` (NOT `radius`)
#   5. Each visible object gets its OWN Solid wrapper (no
#      multi-Shape-per-Solid combining)
#   6. Cardinal direction grounding: object east of another → +X
#      displacement, with both objects properly on the floor
#   7. Vertical placement: above means higher z, with translation
#      reflecting both objects' heights
#
# Color and shape combinations are chosen so that no example overlaps
# with any dev or main sample (purple, orange, white, brown, cyan are
# not used in any test prompt).
#
# Format: prompt-style natural-language `input:` paired with raw .wbt
# `output:`. The s3 strategy formats this into an "Examples / Output:"
# block in the user message.
#
# This file replaces the pre-session
# fewshot_examples_pre_dev_observed_archived.yaml. The previous content
# was generic Webots demonstrations not tailored to observed failures.

examples:

  # Example 1 — single object on a Floor.
  # Demonstrates: Floor primitive (vs faked-as-Box), Solid wrapper for
  # the visible object, on-floor stacking math (translation z = half-
  # height = 0.05 for a 0.1 m cube → bottom touches z = 0).
  - input: |
      A purple cube on the floor.
    output: |
      #VRML_SIM R2025a utf8
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 1 -1 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Floor {
        size 5 5
      }
      Solid {
        translation 0 0 0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0 0.5
            }
            geometry Box {
              size 0.1 0.1 0.1
            }
          }
        ]
        name "purple_cube"
      }

  # Example 2 — two objects with a cardinal placement, both on floor.
  # Demonstrates: ONE Solid per visible object (not multi-Shape per
  # Solid), Solid wrapper (vs Transform), east_of cardinal grounding
  # (sphere at +X relative to box), on-floor math for both objects.
  - input: |
      A small white sphere east of an orange box. Both are on the floor.
    output: |
      #VRML_SIM R2025a utf8
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 2 -2 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Floor {
        size 5 5
      }
      Solid {
        translation 0 0 0.1
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 0.5 0
            }
            geometry Box {
              size 0.2 0.2 0.2
            }
          }
        ]
        name "orange_box"
      }
      Solid {
        translation 0.4 0 0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 1 1
            }
            geometry Sphere {
              radius 0.05
            }
          }
        ]
        name "white_sphere"
      }

  # Example 3 — Cone with correct field name + vertical placement.
  # Demonstrates: Cone uses `bottomRadius` (not `radius` — the field
  # name observed to be hallucinated in s2 even with RAG), `above`
  # vertical grounding (cone's center z > slab's center z + slab's
  # half-height + cone's half-height, so the cone is genuinely above
  # with clear vertical separation).
  # No Floor node here — unlike Examples 1 and 2, this description never
  # says "on the floor", and the project convention (confirmed against
  # every T1 sample) is that Floor is only emitted when the description
  # actually states it. Earlier revisions of this example included one
  # unconditionally; that was inconsistent with the rest of the dataset
  # and has been removed.
  - input: |
      A small brown cone above a wide cyan slab.
    output: |
      #VRML_SIM R2025a utf8
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 1 -1 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Solid {
        translation 0 0 0.025
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 1 1
            }
            geometry Box {
              size 0.4 0.4 0.05
            }
          }
        ]
        name "cyan_slab"
      }
      Solid {
        translation 0 0 0.5
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0.3 0.1
            }
            geometry Cone {
              bottomRadius 0.1
              height 0.2
            }
          }
        ]
        name "brown_cone"
      }
