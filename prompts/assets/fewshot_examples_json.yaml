# JSON-input variant of fewshot_examples.yaml, for the compiled pipeline's
# s3/s4 strategies (JSON -> .wbt) instead of the direct pipeline's NL -> .wbt.
#
# The original fewshot_examples.yaml is untouched and still used by the
# direct pipeline unchanged. This file exists solely because the compiled
# pipeline's generation stage receives the compiler's JSON, never the raw
# prompt (JSON-only downstream, per design) — so a few-shot exemplar
# showing "Input: <natural-language description>" would demonstrate the
# wrong input distribution to a model that never sees raw text in that
# stage. Same 3 scenes, same gold .wbt outputs; only `input:` differs.
#
# `input:` was generated by running each scene description through the
# real compiler (src/generation/compiler/prompt.py, google/gemini-2.5-pro,
# temperature 0) and hand-verified against the paired `output:` before
# being committed here — compiler output is not treated as gold-by-default,
# per the review discipline established when this file was built (an
# unreviewed compiler mistake here would be repeated in every future
# compiled-pipeline fewshot call, not just one sample).
#
# Two corrections made during that review, both already reflected in
# fewshot_examples.yaml directly (not just here):
#   * Color attributes are the literal stated word ("red"), never a
#     computed RGB triplet — the compiler is not supposed to resolve
#     color-word -> RGB; that stays the generation model's job.
#   * Example 3 has no Floor object, matching the project convention
#     (confirmed against every T1 sample) that Floor is only emitted
#     when the description actually states it — this description never
#     says "on the floor".
#
# Updated (2026-08-01) to match the compiler prompt's current output
# contract, not re-run against the live compiler:
#   * Relation "type" is now free text copied verbatim from the
#     description ("east of", with a space) instead of the earlier
#     closed-vocabulary "east_of" — see prompt.py's module docstring for
#     why the compiler no longer normalizes relation wording.
#   * Qualitative size words with no number ("small", "wide") are now
#     transcribed via a "descriptor" attribute instead of being silently
#     dropped — both example 2's sphere and example 3's cone/slab state
#     one and previously lost it.
#   * Color attributes now always use field "color" (never "baseColor" or
#     a per-type name) regardless of object type — the compiler no longer
#     resolves which real Webots field this maps to (a primitive's color
#     is set via a nested PBRAppearance node, not a direct field; some
#     PROTOs use a field literally called "color") — that resolution
#     moved to this file's own `output:` side (the generation stage),
#     which already needs the catalog to build correct syntax regardless.
#     Only the JSON `input:` side changed; every `output:` .wbt below was
#     already correct VRML and needed no edits.
#
# Added (2026-08-01), a 4th example: a T4-scale bedroom with 7 objects,
# a stacking chain (book on box on floor), and a "between" relation —
# the first 3 examples are all 1-3 objects with 0-1 relations, far
# simpler than what T4 actually needs. Base geometry is real: run_
# benchmark.py's --pipeline gold run for t4_45_bedroom_between_variant
# (gemma-27b, 2026-08-01), which the real evaluator scored 7/10 relations.
# Getting this to a genuine e2e_success took three real fixes, verified
# against the live evaluator at every step, not hand-derived and trusted
# blindly:
#   * carpet's east/west sign was backwards (easy, arithmetic).
#   * wooden_box/book's on_top_of height: naive center-of-box math
#     (z = support_top + half_height) does NOT hold for these furniture
#     PROTOs — their origin isn't at their geometric center the way a
#     primitive's is. The correct z for each had to be found empirically
#     (try a value, read the evaluator's actual-vs-expected diagnostic,
#     adjust) rather than computed from the stated size.
#   * The original EXTERNPROTO lines here (bare "Floor", "Bed", ..., the
#     same bare form the gemma-27b run itself used) load but are not
#     "clean" — Webots reports a real error and withholds e2e_success
#     without the full proto URL. Fixed using the real URLs Webots itself
#     reported wanting, cross-checked against source_url in
#     data/processed/webots_clean_catalog.json.
# Final result actually re-verified end-to-end: parse, webots_load
# (clean=true), 10/10 relations, 2/2 attributes, 7/7 objects, 0
# hallucinated fields/objects, e2e_success=True.
#
# Same pass also fixed examples 1 and 2 above, which had the identical
# missing-EXTERNPROTO-for-Floor gap (pre-existing, not introduced today —
# found only because this pass started actually re-verifying output
# against the live evaluator instead of trusting it by inspection). Note:
# fewshot_examples.yaml (the direct-pipeline NL sibling of this file) has
# the same gap in its own examples 1/2 and was NOT touched here — flagged,
# not fixed, since it's out of scope for the compiled-pipeline work this
# pass was scoped to.
#
# Format: identical shape to fewshot_examples.yaml (`input:`/`output:`
# pairs under `examples:`), just with `input:` holding JSON instead of a
# natural-language sentence.

examples:

  - input: |
      {"objects": [
         {"id": "floor", "type": "Floor"},
         {"id": "purple_cube", "type": "Box", "on_top_of": "floor"}],
       "attributes": [
         {"target": "purple_cube", "field": "color", "constraint": "equals", "value": "purple"}],
       "relations": []}
    output: |
      #VRML_SIM R2025a utf8
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/floors/protos/Floor.proto"
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 1 -1 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Floor {
        size 5 5
      }
      Solid {
        translation 0 0 0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0 0.5
            }
            geometry Box {
              size 0.1 0.1 0.1
            }
          }
        ]
        name "purple_cube"
      }

  - input: |
      {"objects": [
         {"id": "floor", "type": "Floor"},
         {"id": "white_sphere", "type": "Sphere", "on_top_of": "floor"},
         {"id": "orange_box", "type": "Box", "on_top_of": "floor"}],
       "attributes": [
         {"target": "white_sphere", "field": "color", "constraint": "equals", "value": "white"},
         {"target": "white_sphere", "field": "descriptor", "constraint": "equals", "value": "small"},
         {"target": "orange_box", "field": "color", "constraint": "equals", "value": "orange"}],
       "relations": [
         {"type": "east of", "subject": "white_sphere", "reference": "orange_box"}]}
    output: |
      #VRML_SIM R2025a utf8
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/floors/protos/Floor.proto"
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 2 -2 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Floor {
        size 5 5
      }
      Solid {
        translation 0 0 0.1
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 0.5 0
            }
            geometry Box {
              size 0.2 0.2 0.2
            }
          }
        ]
        name "orange_box"
      }
      Solid {
        translation 0.4 0 0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 1 1
            }
            geometry Sphere {
              radius 0.05
            }
          }
        ]
        name "white_sphere"
      }

  - input: |
      {"objects": [
         {"id": "brown_cone", "type": "Cone"},
         {"id": "cyan_slab", "type": "Box"}],
       "attributes": [
         {"target": "brown_cone", "field": "color", "constraint": "equals", "value": "brown"},
         {"target": "brown_cone", "field": "descriptor", "constraint": "equals", "value": "small"},
         {"target": "cyan_slab", "field": "color", "constraint": "equals", "value": "cyan"},
         {"target": "cyan_slab", "field": "descriptor", "constraint": "equals", "value": "wide"}],
       "relations": [
         {"type": "above", "subject": "brown_cone", "reference": "cyan_slab"}]}
    output: |
      #VRML_SIM R2025a utf8
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 1 -1 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Solid {
        translation 0 0 0.025
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 1 1
            }
            geometry Box {
              size 0.4 0.4 0.05
            }
          }
        ]
        name "cyan_slab"
      }
      Solid {
        translation 0 0 0.5
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0.3 0.1
            }
            geometry Cone {
              bottomRadius 0.1
              height 0.2
            }
          }
        ]
        name "brown_cone"
      }

  - input: |
      {"objects": [
         {"id": "floor", "type": "Floor"},
         {"id": "bed", "type": "Bed", "on_top_of": "floor"},
         {"id": "carpet", "type": "Carpet", "on_top_of": "floor"},
         {"id": "wooden_box", "type": "WoodenBox", "on_top_of": "floor"},
         {"id": "book", "type": "Book", "on_top_of": "wooden_box"},
         {"id": "cabinet", "type": "Cabinet", "on_top_of": "floor"},
         {"id": "bench", "type": "Bench", "on_top_of": "floor"}],
       "attributes": [
         {"target": "carpet", "field": "color", "constraint": "equals", "value": "blue"},
         {"target": "book", "field": "color", "constraint": "equals", "value": "green"}],
       "relations": [
         {"type": "east of", "subject": "carpet", "reference": "bed"},
         {"type": "west of", "subject": "wooden_box", "reference": "bed"},
         {"type": "south of", "subject": "cabinet", "reference": "bed"},
         {"type": "between", "subject": "bench", "endpoint1": "bed", "endpoint2": "cabinet"}]}
    output: |
      #VRML_SIM R2025a utf8
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/floors/protos/Floor.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/bedroom/protos/Bed.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/living_room_furniture/protos/Carpet.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/factory/containers/protos/WoodenBox.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/school_furniture/protos/Book.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/cabinet/protos/Cabinet.proto"
      EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/street_furniture/protos/Bench.proto"
      WorldInfo {
      }
      Viewpoint {
        orientation -0.5773 0.5773 0.5773 2.0944
        position 1 -1 1
      }
      Background {
        skyColor 0.4 0.6 0.8
      }
      DirectionalLight {
        direction -0.5 -0.5 -1
      }
      Floor {
        size 10 10
      }
      Solid {
        translation 0 0 0
        children [
          Bed {
          }
        ]
        name "bed"
      }
      Solid {
        translation 1 0 0.01
        children [
          Carpet {
            color 0 0 1
          }
        ]
        name "carpet"
      }
      Solid {
        translation -2 0 -0.15
        children [
          WoodenBox {
            size 0.3 0.3 0.3
          }
        ]
        name "wooden_box"
      }
      Solid {
        translation -2 0 0.3
        children [
          Book {
            color 0 1 0
          }
        ]
        name "book"
      }
      Solid {
        translation 0 -2 0
        children [
          Cabinet {
          }
        ]
        name "cabinet"
      }
      Solid {
        translation -0.5 -1 0
        children [
          Bench {
          }
        ]
        name "bench"
      }
